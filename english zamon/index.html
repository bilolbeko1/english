<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Tenses Master - Ingliz Tili Zamonlari</title>
    <style>
        /* Modern Dark Theme Style */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-hover: #334155;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #475569;
            --btn-glow: rgba(56, 189, 248, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: all 0.25s ease-in-out;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--accent-color);
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px var(--btn-glow);
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Category Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .tab-btn:hover, .tab-btn.active {
            background: var(--accent-color);
            color: #000;
            box-shadow: 0 0 15px var(--btn-glow);
            transform: translateY(-2px);
        }

        /* Container Layout */
        .container {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 25px;
            width: 100%;
            max-width: 1200px;
        }

        @media (max-width: 850px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        /* Sidebar - Zamonlar ro'yxati */
        .sidebar {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid var(--border-color);
            max-height: 75vh;
            overflow-y: auto;
        }

        .tense-item {
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            background: #0f172a55;
            border: 1px solid transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Tugmalar bosilish effektlari (Active & Ripple) */
        .tense-item:hover {
            background: var(--card-hover);
            transform: translateX(5px);
            border-color: var(--accent-color);
        }

        .tense-item:active {
            transform: scale(0.97);
        }

        .tense-item.active {
            background: var(--accent-color);
            color: #0f172a;
            font-weight: bold;
        }

        /* Main Content Display */
        .main-content {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .content-header {
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .content-header h2 {
            color: var(--accent-color);
            font-size: 2rem;
        }

        /* Video button effect */
        .youtube-btn {
            background-color: #ff0000;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(255, 0, 0, 0.3);
        }

        .youtube-btn:hover {
            background-color: #cc0000;
            transform: scale(1.05);
            box-shadow: 0 6px 16px rgba(255, 0, 0, 0.5);
        }

        .youtube-btn:active {
            transform: scale(0.95);
        }

        .section-box {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 1.2rem;
            color: var(--accent-color);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .description {
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 15px;
        }

        /* Badges for Signal Words */
        .signals-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .signal-badge {
            background: #0f172a;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
        }

        /* Examples Box */
        .example-card {
            background: #0f172a;
            border-left: 4px solid var(--accent-color);
            padding: 12px 15px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 10px;
        }

        .example-en {
            font-weight: bold;
            color: #fff;
            margin-bottom: 4px;
        }

        .example-uz {
            color: var(--text-muted);
            font-style: italic;
        }

        .formula-box {
            background: #334155;
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 1.1rem;
            color: #38bdf8;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>English Tenses Master</h1>
        <p>Ingliz tilidagi barcha zamonlar, signal so'zlar va darsliklar</p>
    </header>

    <!-- Filters -->
    <div class="tabs">
        <button class="tab-btn active" onclick="filterTenses('all')">Barchasi (12)</button>
        <button class="tab-btn" onclick="filterTenses('Present')">Present</button>
        <button class="tab-btn" onclick="filterTenses('Past')">Past</button>
        <button class="tab-btn" onclick="filterTenses('Future')">Future</button>
    </div>

    <div class="container">
        <!-- Sidebar Navigation -->
        <div class="sidebar" id="tenseList">
            <!-- Dynamic list inserted via JS -->
        </div>

        <!-- Main Details Section -->
        <div class="main-content" id="tenseDetails">
            <!-- Dynamic Content inserted via JS -->
        </div>
    </div>

    <script>
        // Barcha 12 ta zamon ma'lumotlar bazasi (APIsiz)
        const tensesData = [
            {
                id: "present-simple",
                name: "Present Simple",
                category: "Present",
                formula: "Subject + V1 / V-s(es)",
                description: "Doimiy takrorlanib turadigan, odatiy yoki umumiy haqiqat bo'lgan harakatlar uchun ishlatiladi.",
                signals: [
                    { word: "Always", trans: "Har doim" },
                    { word: "Usually", trans: "Odatda" },
                    { word: "Often", trans: "Tez-tez" },
                    { word: "Sometimes", trans: "Ba'zan" },
                    { word: "Every day/week", trans: "Har kuni/haftada" },
                    { word: "Never", trans: "Hech qachon" }
                ],
                examples: [
                    { en: "I study English every day.", uz: "Men har kuni ingliz tilini o'rganaman." },
                    { en: "The sun rises in the east.", uz: "Quyosh sharqdan chiqadi." }
                ],
                videoUrl: "https://www.youtube.com/results?search_query=Present+Simple+tenses+uzbek"
            },
            {
                id: "present-continuous",
                name: "Present Continuous",
                category: "Present",
                formula: "Subject + am/is/are + V-ing",
                description: "Ayni damda (gapirilayotgan vaqtda) sodir bo'layotgan harakatlar uchun ishlatiladi.",
                signals: [
                    { word: "Now", trans: "Hozir" },
                    { word: "At the moment", trans: "Ayni damda" },
                    { word: "Look!", trans: "Qara!" },
                    { word: "Listen!", trans: "Eshit!" },
                    { word: "Currently", trans: "Hozirda" }
                ],
                examples: [
                    { en: "I am learning English right now.", uz: "Men hozirda ingliz tilini o'rganyapman." },
                    { en: "Look! It is raining outside.", uz: "Qara! Tashqarida yomg'ir yog'yapti." }
                ],
                videoUrl: "https://www.youtube.com/results?search_query=Present+Continuous+tenses+uzbek"
            },
            {
                id: "present-perfect",
                name: "Present Perfect",
                category: "Present",
                formula: "Subject + have/has + V3",
                description: "O'tmishda sodir bo me'yoriy yakunlangan, lekin natijasi hozirgi vaqtda ko'rinib turgan harakatlar.",
                signals: [
                    { word: "Already", trans: "Allaqachon" },
                    { word: "Just", trans: "Hozirgina" },
                    { word: "Yet", trans: "Hali (inkor/so'roq)" },
                    { word: "Ever", trans: "Qachondir" },
                    { word: "Never", trans: "Hech qachon" },
                    { word: "Since / For", trans: "...dan beri / ...davomida" }
                ],
                examples: [
                    { en: "I have already finished my homework.", uz: "Men uy vazifamni allaqachon tugatdim." },
                    { en: "She has lived here for 5 years.", uz: "U bu yerda 5 yildan beri yashaydi." }
                ],
                videoUrl: "https://www.youtube.com/results?search_query=Present+Perfect+tense+uzbek"
            },
            {
                id: "present-perfect-continuous",
                name: "Present Perfect Continuous",
                category: "Present",
                formula: "Subject + have/has been + V-ing",
                description: "O'tmishda boshlanib, hozirgacha davom etayotgan yoki yaqindagina tugagan harakatlar.",
                signals: [
                    { word: "For 2 hours", trans: "2 soatdan beri" },
                    { word: "Since morning", trans: "Ertalabdan beri" },
                    { word: "All day", trans: "Kun bo'yi" }
                ],
                examples: [
                    { en: "I have been reading this book for two hours.", uz: "Men ikki soatdan beri ushbu kitobni o'qiyapman." }
                ],
                videoUrl: "https://www.youtube.com/results?search_query=Present+Perfect+Continuous+uzbek"
            },
            {
                id: "past-simple",
                name: "Past Simple",
                category: "Past",
                formula: "Subject + V2 / V-ed",
                description: "O'tmishda aniq bir vaqtda sodir bo'lgan va yakunlangan harakatlar.",
                signals: [
                    { word: "Yesterday", trans: "Kecha" },
                    { word: "Last week/year", trans: "O'tgan hafta/yili" },
                    { word: "An hour ago", trans: "Bir soat oldin" },
                    { word: "In 2020", trans: "2020-yilda" }
                ],
                examples: [
                    { en: "I visited Samarkand last month.", uz: "O'tgan oyi Samarqandga tashrif buyurdim." }
                ],
                videoUrl: "https://www.youtube.com/results?search_query=Past+Simple+tense+uzbek"
            },
            {
                id: "past-continuous",
                name: "Past Continuous",
                category: "Past",
                formula: "Subject + was/were + V-ing",
                description: "O'tmishdagi ma'lum bir vaqt ichida davom etayotgan bo'lgan harakatlar.",
                signals: [
                    { word: "At 5 o'clock yesterday", trans: "Kechak soat 5 da" },
                    { word: "While", trans: "-gan vaqtida" },
                    { word: "When", trans: "-ganda" }
                ],
                examples: [
                    { en: "I was watching TV when you called.", uz: "Siz qo'ng'iroq qilganingizda men TV ko'rayotgandim." }
                ],
                videoUrl: "https://www.youtube.com/results?search_query=Past+Continuous+tense+uzbek"
            },
            {
                id: "past-perfect",
                name: "Past Perfect",
                category: "Past",
                formula: "Subject + had + V3",
                description: "O'tmishdagi boshqa bir harakatdan oldinroq sodir bo'lib bo'lgan harakat.",
                signals: [
                    { word: "Before", trans: "Oldin" },
                    { word: "After", trans: "So'ng" },
                    { word: "By the time", trans: "-vaqtga kelib" }
                ],
                examples: [
                    { en: "The train had left before I arrived.", uz: "Men yetib kelishimdan oldin poezd jo'nab ketgandi." }
                ],
                videoUrl: "https://www.youtube.com/results?search_query=Past+Perfect+tense+uzbek"
            },
            {
                id: "past-perfect-continuous",
                name: "Past Perfect Continuous",
                category: "Past",
                formula: "Subject + had been + V-ing",
                description: "O'tmishdagi ma'lum nuqtaga qadar ma'lum bir muddat davom etgan harakat.",
                signals: [
                    { word: "For 3 hours before...", trans: "...dan oldin 3 soat davomida" }
                ],
                examples: [
                    { en: "He had been working for 5 hours before he took a break.", uz: "U tanaffus qilishdan oldin 5 soat davomida ishlayotgan edi." }
                ],
                videoUrl: "https://www.youtube.com/results?search_query=Past+Perfect+Continuous+uzbek"
            },
            {
                id: "future-simple",
                name: "Future Simple",
                category: "Future",
                formula: "Subject + will + V1",
                description: "Kelajakda sodir bo'ladigan oddiy harakatlar va qarorlar.",
                signals: [
                    { word: "Tomorrow", trans: "Ertaga" },
                    { word: "Next week", trans: "Keyingi hafta" },
                    { word: "Soon", trans: "Tez orada" },
                    { word: "In the future", trans: "Kelajakda" }
                ],
                examples: [
                    { en: "I will call you tomorrow.", uz: "Men ertaga sizga qo'ng'iroq qilaman." }
                ],
                videoUrl: "https://www.youtube.com/results?search_query=Future+Simple+tense+uzbek"
            },
            {
                id: "future-continuous",
                name: "Future Continuous",
                category: "Future",
                formula: "Subject + will be + V-ing",
                description: "Kelajakdagi ma'lum bir vaqtda davom etayotgan bo'ladigan harakat.",
                signals: [
                    { word: "At this time tomorrow", trans: "Ertaga shu vaqtda" },
                    { word: "At 8 PM tonight", trans: "Bugun kechki soat 8 da" }
                ],
                examples: [
                    { en: "At 5 PM tomorrow, I will be playing football.", uz: "Ertaga soat 5 da men futbol o'ynayotgan bo'laman." }
                ],
                videoUrl: "https://www.youtube.com/results?search_query=Future+Continuous+tense+uzbek"
            },
            {
                id: "future-perfect",
                name: "Future Perfect",
                category: "Future",
                formula: "Subject + will have + V3",
                description: "Kelajakdagi ma'lum bir vaqtga kelib tugallangan bo'ladigan harakat.",
                signals: [
                    { word: "By tomorrow", trans: "Ertagacha" },
                    { word: "By next year", trans: "Keyingi yilgacha" }
                ],
                examples: [
                    { en: "I will have finished my project by next Monday.", uz: "Dushanbagacha loyihamni tugatgan bo'laman." }
                ],
                videoUrl: "https://www.youtube.com/results?search_query=Future+Perfect+tense+uzbek"
            },
            {
                id: "future-perfect-continuous",
                name: "Future Perfect Continuous",
                category: "Future",
                formula: "Subject + will have been + V-ing",
                description: "Kelajakdagi ma'lum bir vaqtgacha qancha davom etishi ko'rsatilgan harakat.",
                signals: [
                    { word: "By next month for 2 years", trans: "Keyingi oyga kelib 2 yildan beri" }
                ],
                examples: [
                    { en: "By next year, I will have been living here for 5 years.", uz: "Keyingi yilga kelib, men bu yerda yashayotganimga 5 yil bo'ladi." }
                ],
                videoUrl: "https://www.youtube.com/results?search_query=Future+Perfect+Continuous+uzbek"
            }
        ];

        let selectedTense = tensesData[0];

        // Render List
        function renderSidebar(filter = 'all') {
            const listContainer = document.getElementById('tenseList');
            listContainer.innerHTML = '';

            const filteredData = filter === 'all' 
                ? tensesData 
                : tensesData.filter(item => item.category === filter);

            filteredData.forEach(tense => {
                const item = document.createElement('div');
                item.className = `tense-item ${tense.id === selectedTense.id ? 'active' : ''}`;
                item.innerHTML = `<span>${tense.name}</span> <span>➔</span>`;
                item.onclick = () => {
                    selectedTense = tense;
                    renderSidebar(filter);
                    renderDetails();
                };
                listContainer.appendChild(item);
            });
        }

        // Filter Functionality
        function filterTenses(category) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderSidebar(category);
        }

        // Render Details
        function renderDetails() {
            const detailsContainer = document.getElementById('tenseDetails');
            
            const signalsHTML = selectedTense.signals.map(s => `
                <div class="signal-badge" title="Tarjimasi: ${s.trans}">
                    ${s.word} <small style="color: #cbd5e1; font-weight: normal;">(${s.trans})</small>
                </div>
            `).join('');

            const examplesHTML = selectedTense.examples.map(ex => `
                <div class="example-card">
                    <div class="example-en">"${ex.en}"</div>
                    <div class="example-uz">Tarjimasi: ${ex.uz}</div>
                </div>
            `).join('');

            detailsContainer.innerHTML = `
                <div class="content-header">
                    <h2>${selectedTense.name}</h2>
                    <a href="${selectedTense.videoUrl}" target="_blank" class="youtube-btn">
                        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
                        YouTube Video Dars
                    </a>
                </div>

                <div class="formula-box">
                    <strong>Formula:</strong> ${selectedTense.formula}
                </div>

                <div class="section-box">
                    <div class="section-title">📌 Qoida va Foydalanish:</div>
                    <p class="description">${selectedTense.description}</p>
                </div>

                <div class="section-box">
                    <div class="section-title">🔑 Signal So'zlar (Kalit so'zlar va Tarjimasi):</div>
                    <div class="signals-list">
                        ${signalsHTML}
                    </div>
                </div>

                <div class="section-box">
                    <div class="section-title">💬 Misollar:</div>
                    ${examplesHTML}
                </div>
            `;
        }

        // Initial Load
        renderSidebar();
        renderDetails();
    </script>
</body>
</html>
